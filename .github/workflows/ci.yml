name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    name: Gitleaks (complete history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.0"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}" \
            gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"

      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --log-opts="--full-history --all --diff-filter=tuxdb" \
            .

  python-public-package:
    name: Python public package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.14"]
    defaults:
      run:
        working-directory: Python
        shell: bash -el {0}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create Miniforge library compatibility environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: solarphysics_env_latest
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"
          auto-update-conda: false

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install xarray netCDF4

      - name: Check committed public source
        run: python ../tools/public_source_policy.py

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile public Python sources
        run: python -m compileall -q solar_toolkit tests examples/public_api examples/radio examples/sxr

      - name: Run Ruff
        run: |
          python -m ruff check solar_toolkit tests examples/public_api examples/radio examples/sxr
          python -m ruff check ../tools/public_source_policy.py ../tools/build_distributions.py ../tools/installed_library_smoke.py

      - name: Run public Python tests
        run: python -m pytest tests -ra --junitxml "$RUNNER_TEMP/python-tests.xml"

      - name: Run data-independent examples
        run: |
          python examples/public_api/time_matching_example.py
          python examples/public_api/gaussian_model_example.py
          python examples/radio/synthetic_radio.py --output-dir "$RUNNER_TEMP/radio-example"
          python examples/sxr/sxr_example.py --output-dir "$RUNNER_TEMP/sxr-example"

      - name: Validate wheel and source distribution roundtrip
        run: python ../tools/build_distributions.py --project . --output-dir "$RUNNER_TEMP/library-distributions"

      - name: Install rebuilt wheel in an independent Miniforge environment
        run: |
          conda create --yes --prefix "$RUNNER_TEMP/library-install" --override-channels -c conda-forge python=${{ matrix.python-version }} pip
          conda run --no-capture-output --prefix "$RUNNER_TEMP/library-install" python -m pip install "$RUNNER_TEMP"/library-distributions/rebuilt/*.whl
          conda run --no-capture-output --prefix "$RUNNER_TEMP/library-install" python -m pip check
          cd "$RUNNER_TEMP"
          conda run --no-capture-output --prefix "$RUNNER_TEMP/library-install" python -I "$GITHUB_WORKSPACE/tools/installed_library_smoke.py" --examples "$GITHUB_WORKSPACE/Python/examples" --output-dir "$RUNNER_TEMP/installed-examples"

  apps-miniforge:
    name: Apps (Windows Miniforge)
    runs-on: windows-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create Miniforge application environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: solarphysics_env_latest
          environment-file: Apps/environment.miniforge.yml
          python-version: "3.14"
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"
          auto-update-conda: false
          cache-environment: true
          cache-downloads: true

      - name: Install public library and applications
        run: |
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m pip install --upgrade pip
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m pip install -e ".\Python[quality-ml]"
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m pip install -e ".\Apps[dev]"
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m pip check
          conda run --no-capture-output -n solarphysics_env_latest `
            python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None; assert importlib.util.find_spec('shiboken6') is None"

      - name: Initialize private CI runtime
        run: |
          $env:SOLAR_MINIFORGE_ROOT = $env:CONDA
          conda run --no-capture-output -n solarphysics_env_latest `
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Apps\run.ps1 admin init

      - name: Compile Apps sources and tests
        run: |
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m compileall -q Apps\solar_apps Apps\tests

      - name: Run Apps Ruff checks
        run: |
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m ruff check Apps\solar_apps Apps\tests

      - name: Check Apps formatting
        run: |
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m black --check Apps\solar_apps Apps\tests

      - name: Run Apps tests and repository contracts
        run: |
          conda run --no-capture-output -n solarphysics_env_latest `
            python -m pytest Apps\tests -ra `
              --basetemp Local\tmp\pytest-apps-ci

      - name: Run offline Apps health matrix
        run: |
          $env:SOLAR_MINIFORGE_ROOT = $env:CONDA
          $healthReport = Join-Path $env:RUNNER_TEMP "apps-health.json"
          conda run --no-capture-output -n solarphysics_env_latest `
            powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\Apps\run.ps1 tools health --output $healthReport
          $healthExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $healthReport) {
            Get-Content -Raw -LiteralPath $healthReport
          }
          if ($healthExitCode -ne 0) {
            throw "Apps health matrix failed (exit code $healthExitCode; see $healthReport)"
          }

      - name: Smoke canonical frontend help
        run: |
          $env:SOLAR_MINIFORGE_ROOT = $env:CONDA
          $frontends = conda run -n solarphysics_env_latest python -c `
            "from solar_apps.frontends.catalog import FRONTENDS; print(*sorted(item.id for item in FRONTENDS), sep='\n')"
          foreach ($frontend in $frontends) {
            conda run --no-capture-output -n solarphysics_env_latest `
              powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\Apps\run.ps1 frontend $frontend --help
            if ($LASTEXITCODE -ne 0) {
              throw "Frontend help failed: $frontend"
            }
          }

      - name: Validate Apps wheel and source distribution roundtrip
        run: |
          conda run --no-capture-output -n solarphysics_env_latest `
            python tools/public_source_policy.py
          conda run --no-capture-output -n solarphysics_env_latest `
            python tools/build_distributions.py --project Apps --output-dir "$env:RUNNER_TEMP/apps-distributions"

  apps-macos-miniforge:
    name: Apps (macOS arm64 Miniforge)
    runs-on: macos-15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      QT_QPA_PLATFORM: "offscreen"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create Miniforge application environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: solarphysics_env_latest
          environment-file: Apps/environment.miniforge.yml
          python-version: "3.14"
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"
          auto-update-conda: false
          cache-environment: true
          cache-downloads: true

      - name: Install public library and applications
        run: |
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m pip install --upgrade pip
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m pip install -e "./Python[quality-ml]"
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m pip install -e "./Apps[dev]"
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m pip check
          conda run --no-capture-output -n solarphysics_env_latest \
            python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None; assert importlib.util.find_spec('shiboken6') is None"

      - name: Initialize private CI runtime
        run: |
          chmod +x Apps/run.sh
          export SOLAR_MINIFORGE_ROOT="$CONDA"
          conda run --no-capture-output -n solarphysics_env_latest \
            ./Apps/run.sh admin init

      - name: Compile, lint, format-check, and test Apps
        run: |
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m compileall -q Apps/solar_apps Apps/tests
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m ruff check Apps/solar_apps Apps/tests
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m black --check Apps/solar_apps Apps/tests
          conda run --no-capture-output -n solarphysics_env_latest \
            python -m pytest Apps/tests -ra \
              --basetemp Local/tmp/pytest-apps-macos-ci

      - name: Run offline Apps health matrix
        run: |
          export SOLAR_MINIFORGE_ROOT="$CONDA"
          health_report="${RUNNER_TEMP}/apps-health.json"
          set +e
          conda run --no-capture-output -n solarphysics_env_latest \
            ./Apps/run.sh tools health --output "$health_report"
          health_exit=$?
          if [ -f "$health_report" ]; then
            cat "$health_report"
          fi
          exit "$health_exit"

      - name: Smoke all canonical frontend help
        run: |
          export SOLAR_MINIFORGE_ROOT="$CONDA"
          for frontend in $(conda run -n solarphysics_env_latest python -c \
            "from solar_apps.frontends.catalog import FRONTENDS; print(*sorted(item.id for item in FRONTENDS), sep='\n')")
          do
            conda run --no-capture-output -n solarphysics_env_latest \
              ./Apps/run.sh frontend "$frontend" --help
          done

      - name: Validate Apps wheel and source distribution roundtrip
        run: |
          conda run --no-capture-output -n solarphysics_env_latest \
            python tools/public_source_policy.py
          conda run --no-capture-output -n solarphysics_env_latest \
            python tools/build_distributions.py --project Apps --output-dir "$RUNNER_TEMP/apps-distributions"
