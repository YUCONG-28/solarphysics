[project]
name = "solar-physics-toolkit"
dynamic = ["version"]
description = "Reusable scientific libraries for multi-wavelength solar data analysis"
authors = [
    {name = "Severus / Lee / Ninghao"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "astropy>=5.3.0",
    "sunpy[map,net]>=5.0.0",
    "mpl-animators>=1.2.0",
    "matplotlib>=3.7.0",
    "reproject>=0.10.0",
    "scikit-image>=0.21.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
quality-autoencoder = [
    "torch>=2.3,<3",
]
quality-ml = [
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
]
dev = [
    "build>=1.2.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
]
full = [
    "av>=16,<19",
    "xarray>=2023.6.0",
    "netCDF4>=1.6.0",
    "imageio>=2.31.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "seaborn>=0.12.0",
    "dask>=2023.6.0",
    "fitsio>=1.2.0",
    "skyfield>=1.45",
    "requests>=2.31.0",
]
[project.urls]
Homepage = "https://github.com/YUCONG-28/solarphysics"
Repository = "https://github.com/YUCONG-28/solarphysics.git"
Issues = "https://github.com/YUCONG-28/solarphysics/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "solar_toolkit._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["solar_toolkit*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:cacheprovider"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
